

# ============================================================
# Patient Management System — Docker Compose
# ============================================================
# Starts all backend services:
#   auth-service     : 4005
#   patient-service  : 4000  (depends on auth, billing, postgresql, kafka)
#   billing-service  : 4001  (gRPC: 9001)
#   analytics-service: 4002  (Kafka consumer)
#   gateway          : 4004  (Spring Cloud Gateway — routes traffic to services above)
#
# Usage:
#   docker compose up -d --build      # first time / after code changes
#   docker compose up -d              # subsequent runs (uses cached images)
#   docker compose logs -f gateway    # tail a specific service
#   docker compose down               # stop all
#   docker compose down -v            # stop + wipe volumes (reset DB)
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — used by patient-service
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Zookeeper + Kafka — used by analytics-service and patient-service
  # ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pm-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Auth Service  →  http://localhost:4005
  # ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: pm-auth-service
    ports:
      - "4005:4005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4005/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ──────────────────────────────────────────────────────────
  # Billing Service  →  gRPC port 9001
  # ──────────────────────────────────────────────────────────
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: pm-billing-service
    ports:
      - "4001:4001"
      - "9001:9001"

  # ──────────────────────────────────────────────────────────
  # Analytics Service  →  http://localhost:4002
  # ──────────────────────────────────────────────────────────
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: pm-analytics-service
    ports:
      - "4002:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # Patient Service  →  http://localhost:4000
  # ──────────────────────────────────────────────────────────
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: pm-patient-service
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patientdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # gRPC address of billing-service (inside Docker network)
      GRPC_CLIENT_BILLING_SERVICE_ADDRESS: static://billing-service:9001
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # Gateway  →  http://localhost:4004  (FRONTEND TALKS TO THIS)
  # ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pm-gateway
    ports:
      - "4004:4004"
    environment:
      # Override gateway routes to use Docker service names
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: auth-service-route
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://auth-service:4005
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/auth/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=1
      AUTH_SERVICE_URL: http://auth-service:4005
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4004/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    driver: local
